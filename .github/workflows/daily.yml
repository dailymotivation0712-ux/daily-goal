# Runs the whole pipeline every day: find BWF clips -> pick the best play -> email it.
name: Daily play email

on:
  schedule:
    - cron: "0 12 * * *"  # every day at 12:00 UTC (8am New York, 1pm London)
  workflow_dispatch:  # adds a "Run workflow" button for testing

jobs:
  send:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # lets the last step save today's pick for the website
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python pick_clip.py

      - name: Email (send to subscribers)
        run: python send_email.py --send

      # The website reads docs/today.json (today's goal) and docs/archive.json (past goals).
      - name: Publish today's pick to the website
        if: ${{ !cancelled() }}  # still runs if an email step failed, so the site stays fresh
        run: |
          python publish_site.py
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add docs/today.json docs/archive.json
          git diff --cached --quiet || (git commit -m "Today's goal" && git push)
